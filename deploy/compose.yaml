# ERPNext stack pre Portainer (Synology NAS).
# Vychádza z oficiálneho frappe_docker/pwd.yml; heslá a verzia idú z env premenných stacku
# (pozri deploy/.env.example).

x-erpnext-image: &erpnext-image
  image: frappe/erpnext:${ERPNEXT_VERSION:-v16.50.0}
  networks:
    - frappe_network
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-redis-env: &redis-env
  FRAPPE_REDIS_CACHE: redis://redis-cache:6379
  FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

services:
  configurator:
    <<: *erpnext-image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy

  create-site:
    <<: *erpnext-image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        wait-for-it -t 120 db:3306
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379
        start=$$(date +%s)
        cfg=sites/common_site_config.json
        until [[ -n $$(jq -r '.db_host // empty' $$cfg 2>/dev/null) ]] &&
              [[ -n $$(jq -r '.redis_cache // empty' $$cfg 2>/dev/null) ]] &&
              [[ -n $$(jq -r '.redis_queue // empty' $$cfg 2>/dev/null) ]]; do
          echo "Waiting for $$cfg to be created"
          sleep 5
          if (( $$(date +%s) - start > 120 )); then
            echo "could not find $$cfg with required keys"
            exit 1
          fi
        done
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists, skipping creation"
        else
          bench new-site --mariadb-user-host-login-scope='%' \
            --admin-password="$$ADMIN_PASSWORD" \
            --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD" \
            --install-app erpnext --set-default "$$SITE_NAME"
        fi
    environment:
      SITE_NAME: ${SITE_NAME:-erp.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD musí byť nastavené}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD musí byť nastavené}
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *erpnext-image
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    <<: *erpnext-image
    restart: unless-stopped
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.local}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${HTTP_PORT:-8085}:8080"
    depends_on:
      - backend
      - websocket

  websocket:
    <<: *erpnext-image
    restart: unless-stopped
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment: *redis-env
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    <<: *erpnext-image
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short,default"]
    environment: *redis-env
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    <<: *erpnext-image
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment: *redis-env
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    <<: *erpnext-image
    restart: unless-stopped
    command: ["bench", "schedule"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8
    restart: unless-stopped
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD musí byť nastavené}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - frappe_network

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - frappe_network
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
